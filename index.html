<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do App</title>
    <link rel="stylesheet" href="src/output.css" />
  </head>
  <body
    class="min-h-screen flex items-center justify-center px-3 bg-gradient-to-br from-indigo-600 via-purple-600 to-pink-500"
  >
    <!-- Card -->
    <div
      class="w-full max-w-sm p-[1px] rounded-2xl bg-gradient-to-r from-white/40 to-white/10 backdrop-blur-lg"
    >
      <div
        class="bg-white/80 backdrop-blur-md rounded-2xl p-5 space-y-4 shadow-xl"
      >
        <!-- Header -->
        <div class="text-center">
          <h1 class="text-xl font-bold text-gray-800 tracking-wide">
            Today Plan
          </h1>
          <p class="text-xs text-gray-500">Make your day productive 🚀</p>
        </div>

        <!-- Input -->
        <div class="flex gap-2">
          <input
            id="taskAddInput"
            type="text"
            placeholder="Add a task..."
            class="flex-1 px-3 py-2 text-sm rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
          />

          <button
           id="taskAddBtn" class="px-4 py-2 text-sm text-white rounded-lg bg-gradient-to-r from-purple-600 to-pink-500 hover:scale-105 active:scale-95 transition duration-200 shadow-md"
          >
            Add
          </button>
        </div>

        <!-- Filter Tabs -->
        <div class="flex bg-gray-100 rounded-lg p-1 text-sm">
          <button
            class="flex-1 bg-white rounded-md py-1 font-medium shadow-sm transition"
          >
            All
          </button>
          <button class="flex-1 text-gray-500 hover:text-purple-600 transition">
            Done
          </button>
          <button class="flex-1 text-gray-500 hover:text-purple-600 transition">
            Pending
          </button>
        </div>

        <!-- Task List -->
        <ul id="addTask" class="space-y-2">
          <!-- Task -->
          <li
            class="flex items-center justify-between p-2 rounded-lg bg-white shadow-sm hover:shadow-md hover:-translate-y-[2px] transition duration-200"
          >
            <div class="flex items-center gap-2">
              <input type="checkbox" class="accent-purple-600" />
              <span id="addTaskText" class="text-sm">Learn Tailwind</span>
            </div>

            <button id="addTaskDelete" class="text-red-400 hover:text-red-600 transition">
              ✕
            </button>
          </li>

          <!-- Completed -->
          <!-- <li
            class="flex items-center justify-between p-2 rounded-lg bg-white shadow-sm opacity-70 hover:opacity-100 transition"
          >
            <div class="flex items-center gap-2">
              <input type="checkbox" checked class="accent-purple-600" />
              <span class="text-sm line-through text-gray-400"
                >Practice JS</span
              >
            </div>

            <button class="text-red-400 hover:text-red-600 transition">
              ✕
            </button>
          </li> -->
        </ul>

        <!-- Footer -->
        <div class="flex justify-between items-center text-xs text-gray-500">
          <span id="addTaskNumber">2 tasks</span>
          <button id="deleteTask" class="text-red-500 hover:underline transition">
            Clear All
          </button>
        </div>
        
      </div>
    </div>


    <script src="js/script.js"></script>
  </body>
</html>
